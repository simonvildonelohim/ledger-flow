spring:
  application:
    name: ledger-notifier
  # A database of its own, not a schema inside ledger-api's. Two services sharing
  # one database share a deployment: a migration from either can break the other,
  # and neither can be restored without the other's agreement.
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerflow_notifier
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # The group id is what makes the offset durable: restart this service and it
      # resumes where it stopped rather than replaying from the beginning.
      group-id: ledger-notifier
      # Only applies the first time this group is seen. From then on the stored
      # offset wins, so an existing deployment is not affected by this setting.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Commit after each handled record rather than after a whole poll batch. A
      # crash mid-batch then redelivers one message instead of the batch, which
      # deduplication makes harmless.
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health, info
