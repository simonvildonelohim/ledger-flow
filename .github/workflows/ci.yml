name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and verify
        # `verify` runs unit tests (surefire) and integration tests (failsafe).
        # The integration tests spin up real containers via Testcontainers,
        # which GitHub's ubuntu-latest runners support out of the box.
        run: ./mvnw --batch-mode --no-transfer-progress verify
