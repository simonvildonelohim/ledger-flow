spring:
  application:
    name: ledger-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ledgerflow
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      # Renders Spring's own exceptions as RFC 9457 application/problem+json,
      # so a missing header and a rejected field share one response shape.
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: 8080

---
# Everything that runs in a container. Logs go to stdout as one JSON object per
# line, because that is where a log collector reads them and a human does not.
#
# ECS rather than a hand-rolled shape: it is a published schema, so a collector
# knows what log.level and service.name mean without being told. Every MDC entry
# is added to the object automatically, which is what will make the correlation
# id in issue #35 queryable rather than buried in a message string.
spring:
  config:
    activate:
      on-profile: containers

logging:
  structured:
    format:
      console: ecs
